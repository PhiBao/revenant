[package]
name = "revenant-core"
description = "Revenant engine: archive timestamps and the fidelity classifier. No network, no framework code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lol_html = "3.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"

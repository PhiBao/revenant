<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d"><title id="t">Revenant architecture</title><desc id="d">The browser talks to one Rust server. The server runs the engine, which reads captures through one interface that is either stored fixtures or the live Internet Archive.</desc><defs><marker id="arrow-7ee0a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ee0a1"/></marker><marker id="arrow-dcb55b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dcb55b"/></marker><marker id="arrow-e0805a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0805a"/></marker><marker id="arrow-e8e3d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8e3d2"/></marker><marker id="arrow-a49d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a49d87"/></marker></defs><rect width="980" height="470" fill="#0b0c0a"/><text x="30" y="34" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" fill="#6f6a58" text-anchor="start">WHAT TALKS TO WHAT</text><rect x="30" y="70" width="200" height="110" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="44" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Browser</text><text x="44" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Next.js, built as static</text><text x="44" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">files. One column, four</text><text x="44" y="152" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">acts.</text><rect x="290" y="70" width="250" height="110" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="304" y="96" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8e3d2">revenant-api</text><text x="304" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Axum. Jobs, ZIP download,</text><text x="304" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">live runs, rate limits.</text><text x="304" y="152" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Also serves the web app.</text><rect x="290" y="250" width="250" height="110" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="304" y="276" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8e3d2">revenant-core</text><text x="304" y="298" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Pure Rust. No network, no</text><text x="304" y="315" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">framework. Classifier,</text><text x="304" y="332" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">rewriter, ZIP, pipeline.</text><rect x="600" y="250" width="215" height="62" fill="#0b0c0a" stroke="#2a2c25" stroke-width="1.5"/><text x="614" y="276" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49d87">SnapshotSource</text><text x="614" y="298" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">one interface, two sources</text><rect x="580" y="372" width="180" height="84" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="594" y="398" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8e3d2">SeededSource</text><text x="594" y="420" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">saved archive data in</text><text x="594" y="437" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">fixtures/snapshots/</text><rect x="780" y="372" width="180" height="84" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="794" y="398" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8e3d2">LiveSource</text><text x="794" y="420" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">asks the archive,</text><text x="794" y="437" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">one request at a time</text><rect x="760" y="70" width="200" height="110" fill="#11130f" stroke="#e0805a" stroke-width="1.5"/><text x="774" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Internet Archive</text><text x="774" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">web.archive.org: the only</text><text x="774" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">host Revenant ever</text><text x="774" y="152" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">contacts.</text><line x1="230" y1="110" x2="290" y2="110" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><text x="260" y="100" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87" text-anchor="middle">JSON</text><line x1="290" y1="150" x2="230" y2="150" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="415" y1="180" x2="415" y2="250" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><text x="415" y="222" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87" text-anchor="middle">resurrect()</text><line x1="540" y1="285" x2="600" y2="276" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="670" y1="312" x2="670" y2="372" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="740" y1="312" x2="840" y2="372" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="930" y1="372" x2="930" y2="180" stroke="#e0805a" stroke-width="1.6" marker-end="url(#arrow-e0805a)"/><text x="918" y="280" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e0805a" text-anchor="end">index + replay</text><rect x="30" y="250" width="200" height="110" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="44" y="276" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8e3d2">/p/ preview</text><text x="44" y="298" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Restored pages, served</text><text x="44" y="315" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">with a sandboxing CSP.</text><text x="44" y="332" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Never from /api.</text><line x1="330" y1="180" x2="230" y2="262" stroke="#7ee0a1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-7ee0a1)"/><line x1="110" y1="250" x2="110" y2="180" stroke="#7ee0a1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-7ee0a1)"/><text x="124" y="222" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7ee0a1" text-anchor="start">iframe</text><text x="30" y="458" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" fill="#6f6a58" text-anchor="start">Green = contained or verified. Rust = outside Revenant's control.</text></svg>

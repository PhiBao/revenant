<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="t d"><title id="t">Trust boundaries</title><desc id="d">Two kinds of untrusted data are contained. What the visitor types is validated and only sent as a query to the archive's index. What the archive returns is rewritten, stripped of script, and shown only inside a sandboxed frame.</desc><defs><marker id="arrow-7ee0a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ee0a1"/></marker><marker id="arrow-dcb55b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dcb55b"/></marker><marker id="arrow-e0805a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0805a"/></marker><marker id="arrow-e8e3d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8e3d2"/></marker><marker id="arrow-a49d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a49d87"/></marker></defs><rect width="980" height="520" fill="#0b0c0a"/><text x="30" y="34" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" fill="#6f6a58" text-anchor="start">WHERE UNTRUSTED THINGS ARE CONTAINED</text><text x="950" y="34" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6f6a58" text-anchor="end">dashed = a query going out   solid = bytes coming back</text><rect x="20" y="56" width="270" height="440" fill="none" stroke="#e0805a" stroke-width="1" stroke-dasharray="2 5"/><text x="32" y="74" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e0805a" text-anchor="start">THE VISITOR</text><rect x="40" y="90" width="230" height="92" fill="#11130f" stroke="#e0805a" stroke-width="1.5"/><text x="54" y="116" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">The address and date</text><text x="54" y="138" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">typed by anyone</text><rect x="40" y="210" width="230" height="110" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="54" y="236" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Never fetched</text><text x="54" y="258" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">The address is not requested.</text><text x="54" y="275" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Its host and path become a</text><text x="54" y="292" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">percent-encoded query.</text><rect x="40" y="350" width="230" height="120" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="54" y="376" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Rejected up front</text><text x="54" y="398" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">IP addresses, localhost,</text><text x="54" y="415" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">user info, non-http schemes,</text><text x="54" y="432" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">bad paths, over 2048 bytes.</text><rect x="310" y="56" width="330" height="440" fill="none" stroke="#7ee0a1" stroke-width="1" stroke-dasharray="2 5"/><text x="322" y="74" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7ee0a1" text-anchor="start">REVENANT SERVER</text><rect x="330" y="90" width="290" height="78" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="344" y="116" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Validate, then rate-limit</text><text x="344" y="138" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">rights box ticked, 16 KiB body cap,</text><text x="344" y="155" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">2 live runs at once</text><rect x="330" y="196" width="290" height="78" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="344" y="222" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">One host only</text><text x="344" y="244" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">only the configured archive host;</text><text x="344" y="261" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">off-host redirects are refused</text><rect x="330" y="302" width="290" height="78" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="344" y="328" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Rewrite the archive's HTML</text><text x="344" y="350" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">scripts and handlers removed,</text><text x="344" y="367" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">archive URLs unwrapped</text><rect x="330" y="408" width="290" height="76" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="344" y="434" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Serve only the job's own files</text><text x="344" y="456" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">paths checked against the ZIP,</text><text x="344" y="473" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">content type from an allowlist</text><rect x="660" y="56" width="300" height="440" fill="none" stroke="#e0805a" stroke-width="1" stroke-dasharray="2 5"/><text x="672" y="74" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e0805a" text-anchor="start">CONTENT FROM OUTSIDE</text><rect x="680" y="90" width="260" height="92" fill="#11130f" stroke="#e0805a" stroke-width="1.5"/><text x="694" y="116" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">The Internet Archive</text><text x="694" y="138" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">bytes of pages written by</text><text x="694" y="155" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">strangers, years ago</text><rect x="680" y="230" width="260" height="92" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="694" y="256" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Preview frame</text><text x="694" y="278" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">CSP: sandbox; default-src 'none'</text><text x="694" y="295" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">nosniff, no-referrer, noindex</text><rect x="680" y="350" width="260" height="128" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="694" y="376" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Browser iframe</text><text x="694" y="398" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">sandbox="" : no script, no</text><text x="694" y="415" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">forms, no same-origin access.</text><text x="694" y="432" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">It cannot reach /api or other</text><text x="694" y="449" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">jobs.</text><line x1="155" y1="182" x2="155" y2="210" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="270" y1="136" x2="330" y2="130" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="620" y1="235" x2="680" y2="120" stroke="#e0805a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-e0805a)"/><line x1="680" y1="165" x2="620" y2="330" stroke="#e0805a" stroke-width="1.6" marker-end="url(#arrow-e0805a)"/><line x1="475" y1="380" x2="475" y2="408" stroke="#7ee0a1" stroke-width="1.6" marker-end="url(#arrow-7ee0a1)"/><line x1="620" y1="446" x2="680" y2="292" stroke="#7ee0a1" stroke-width="1.6" marker-end="url(#arrow-7ee0a1)"/><line x1="810" y1="322" x2="810" y2="350" stroke="#7ee0a1" stroke-width="1.6" marker-end="url(#arrow-7ee0a1)"/></svg>

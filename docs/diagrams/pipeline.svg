<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="t d"><title id="t">The restore pipeline</title><desc id="d">One archived page becomes a ZIP and a certificate in eight steps: look up the page, classify it, discover its assets, classify and fetch each, rewrite the page, write the certificate, pack a deterministic ZIP, hash it.</desc><defs><marker id="arrow-7ee0a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ee0a1"/></marker><marker id="arrow-dcb55b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dcb55b"/></marker><marker id="arrow-e0805a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0805a"/></marker><marker id="arrow-e8e3d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8e3d2"/></marker><marker id="arrow-a49d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a49d87"/></marker></defs><rect width="980" height="520" fill="#0b0c0a"/><text x="30" y="34" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" fill="#6f6a58" text-anchor="start">HOW A CORPSE BECOMES A SITE</text><rect x="18" y="70" width="218" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="32" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">1  Ask for the page</text><text x="32" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">last capture on or before</text><text x="32" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">the date; first one after</text><line x1="236" y1="116" x2="264" y2="116" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><rect x="264" y="70" width="218" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="278" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">2  Classify it</text><text x="278" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Proven, Likely, Uncertain,</text><text x="278" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Anachronism or Missing</text><line x1="482" y1="116" x2="510" y2="116" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><rect x="510" y="70" width="218" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="524" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">3  Fetch its body</text><text x="524" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">the chosen capture, raw</text><text x="524" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">replay: no archive banner</text><line x1="728" y1="116" x2="756" y2="116" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><rect x="756" y="70" width="218" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="770" y="96" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">4  Find the assets</text><text x="770" y="118" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">read the page itself:</text><text x="770" y="135" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">images, styles, backgrounds</text><rect x="30" y="220" width="440" height="130" fill="#11130f" stroke="#dcb55b" stroke-width="1.5"/><text x="44" y="246" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">5  For each asset</text><text x="44" y="268" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">ask, classify, then decide:</text><text x="44" y="285" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Proven / Likely / Uncertain  -&gt;  include</text><text x="44" y="302" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Anachronism  -&gt;  include only if you allow it</text><text x="44" y="319" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">Missing / Unknown  -&gt;  leave out, keep in the ledger</text><line x1="865" y1="162" x2="865" y2="190" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="865" y1="190" x2="250" y2="190" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="250" y1="190" x2="250" y2="220" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><rect x="520" y="220" width="430" height="130" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="534" y="246" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">6  Rewrite the page</text><text x="534" y="268" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">unwrap archive URLs, point links at files in the ZIP</text><text x="534" y="285" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">flag links to files that were not restored</text><text x="534" y="302" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">remove scripts, inline handlers, base, comments</text><text x="534" y="319" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">bytes outside the markup are left exactly as they were</text><line x1="470" y1="285" x2="520" y2="285" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><rect x="30" y="400" width="300" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="44" y="426" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">7  Write the certificate</text><text x="44" y="448" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">every file: verdict, capture time,</text><text x="44" y="465" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">days from the date, SHA-256</text><rect x="370" y="400" width="270" height="92" fill="#11130f" stroke="#3c3f35" stroke-width="1.5"/><text x="384" y="426" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">8  Pack and hash</text><text x="384" y="448" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">entries sorted, times fixed,</text><text x="384" y="465" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">stored not compressed</text><rect x="680" y="400" width="270" height="92" fill="#11130f" stroke="#7ee0a1" stroke-width="1.5"/><text x="694" y="426" font-family="Georgia, 'Iowan Old Style', serif" font-size="17" fill="#e8e3d2">Same input, same bytes</text><text x="694" y="448" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">the ZIP's SHA-256 is the</text><text x="694" y="465" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49d87">same on every machine</text><line x1="735" y1="350" x2="735" y2="375" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="735" y1="375" x2="180" y2="375" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="180" y1="375" x2="180" y2="400" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="330" y1="446" x2="370" y2="446" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/><line x1="640" y1="446" x2="680" y2="446" stroke="#a49d87" stroke-width="1.6" marker-end="url(#arrow-a49d87)"/></svg>

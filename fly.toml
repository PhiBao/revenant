# Fly.io config. Not deployed yet: run `fly launch --copy-config --no-deploy`, then `fly deploy`.
# The app name must be globally unique; change it if "revenant-kiroween" is taken.
app = "revenant-kiroween"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Fly terminates TLS and forwards the visitor's address in X-Forwarded-For.
  REVENANT_TRUST_PROXY = "1"
  # One trusted proxy (Fly's) sits in front. The client address is the last X-Forwarded-For entry.
  REVENANT_PROXY_HOPS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "3s"

[[vm]]
  # The smallest size is enough: jobs are held in memory for one hour and bodies are capped.
  size = "shared-cpu-1x"
  memory = "256mb"
